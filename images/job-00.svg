ize="21" font-weight="400" fill="#1F2A44" text-anchor="start"></text><rect x="512" y="384" width="256" height="14" rx="7.0" fill="#ECE8DE"/><rect x="512" y="384" width="248.32" height="14" rx="7.0" fill="#1971C2"/><line x1="691.2" y1="378" x2="691.2" y2="404" stroke="#1F2A44" stroke-width="2.5"/><text x="512.0" y="438.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#1971C2" text-anchor="start">0.97 yes</text><rect x="814" y="262" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="836.0" y="300.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">Which one</text><text x="836.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Which queue?</text><rect x="836" y="362" width="85.0" height="36" rx="18.0" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/><text x="878.5" y="386.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="middle">Billing</text><rect x="929.0" y="362" width="97.0" height="36" rx="18.0" fill="#0C8599" stroke="#0C8599" stroke-width="2"/><text x="977.5" y="386.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Outage</text><text x="836.0" y="438.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#0C8599" text-anchor="start">confidence 1.00</text><rect x="490" y="486" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="512.0" y="524.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">How much</text><text x="512.0" y="566.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">How fully covered?</text><rect x="512" y="594" width="256" height="12" rx="6" fill="#ECE8DE"/><circle cx="757.1" cy="600" r="11" fill="#AE3EC9"/><text x="512.0" y="646.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">not at all</text><text x="768.0" y="646.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="end">fully</text><rect x="814" y="486" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="836.0" y="524.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">Where</text><path d="M836,552 q0,-8 8,-8 h86 l26,26 v86 q0,8 -8,8 h-112 q-8,0 -8,-8 z" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><path d="M930,544 v26 h26" fill="#EFEBE2" stroke="#D9D4C7" stroke-width="1.5"/><rect x="860" y="588" width="60" height="9" rx="4.5" fill="#D9D4C7"/><rect x="860" y="614" width="23" height="9" rx="4.5" fill="#D9D4C7"/><rect x="860" y="640" width="-14" height="9" rx="4.5" fill="#D9D4C7"/><rect x="860" y="666" width="39" height="9" rx="4.5" fill="#D9D4C7"/><rect x="850" y="604" width="82" height="36" rx="3" fill="none" stroke="#1C7ED6" stroke-width="3"/><text x="976.0" y="586.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Where is</text><text x="976.0" y="614.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">the total?</text><line x1="1150" y1="460" x2="1215" y2="460" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><text x="1240.0" y="292.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2A44" text-anchor="start">What your rules do</text><circle cx="1266" cy="345" r="26" fill="#2B8A3E"/><path d="M1254.3,345.52 l8.32,8.32 l15.6,-16.12" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1306.0" y="343.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Act</text><text x="1306.0" y="373.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">sure enough</text><circle cx="1266" cy="425" r="26" fill="#E8890C"/><circle cx="1266" cy="417.72" r="6.24" fill="#fff"/><path d="M1254.04,438.0 q11.96,-16.12 23.92,0" fill="#fff"/><text x="1306.0" y="423.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Ask a person</text><text x="1306.0" y="453.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">not sure</text><circle cx="1266" cy="505" r="26" fill="#C92A2A"/><path d="M1256.12,495.12 L1275.88,514.88 M1275.88,495.12 L1256.12,514.88" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><text x="1306.0" y="503.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Stop</text><text x="1306.0" y="533.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">block, or don’t act</text><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(0 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(45 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(90 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(135 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(180 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(225 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(270 1266 585)"/><rect x="1261.84" y="558.48" width="8.32" height="10.4" rx="2" fill="#1F2A44" transform="rotate(315 1266 585)"/><circle cx="1266" cy="585" r="18.72" fill="#1F2A44"/><circle cx="1266" cy="585" r="7.8" fill="#FFFFFF"/><text x="1306.0" y="583.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Software runs it</text><text x="1306.0" y="613.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">a neutral step</text><circle cx="1266" cy="665" r="26" fill="#E8890C"/><text x="1266.0" y="675.9" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#fff" text-anchor="middle">?</text><text x="1306.0" y="663.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Caveat</text><text x="1306.0" y="693.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">read the note</text><line x1="1266" y1="728" x2="1266" y2="756" stroke="#1F2A44" stroke-width="2.5"/><text x="1306.0" y="750.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">your threshold on a bar</text>
