<rect width="1600" height="900" fill="#F7F5F0"/>
<text x="70.0" y="82.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#1F2A44" text-anchor="start">Overview</text>
<text x="70.0" y="152.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="54" font-weight="600" fill="#1F2A44" text-anchor="start">Jev gives an answer and your software acts on it</text>
