<text x="70.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">The conversation</text><text x="640.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">How fully covered</text><text x="1160.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">The checklist</text>
<rect x="70" y="262" width="480" height="300" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="92.0" y="300.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">Live transcript (customer)</text><text x="92.0" y="340.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">“We’re on SQL Server 2016, on-prem, roughly four</text><text x="92.0" y="364.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">terabytes across two instances.”</text><text x="92.0" y="411.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">“On budget, I’d rather come back to that later once</text><text x="92.0" y="436.1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">we’ve seen a proposal.”</text><text x="92.0" y="482.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">“I’ll be recommending it, but the final sign-off sits</text><text x="92.0" y="507.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2A44" text-anchor="start">with our CFO, Maria.”</text><line x1="560" y1="430" x2="628" y2="430" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="640" y="262" width="440" height="390" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="666.0" y="306.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Database named</text><text x="1054.0" y="306.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#AE3EC9" text-anchor="end">4.8</text><rect x="666" y="322" width="388" height="12" rx="6" fill="#ECE8DE"/><line x1="811.5" y1="314" x2="811.5" y2="342" stroke="#1F2A44" stroke-width="2.5"/><circle cx="1037.51" cy="328" r="11" fill="#AE3EC9"/><text x="666.0" y="436.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Budget given</text><text x="1054.0" y="436.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#E8890C" text-anchor="end">2.1</text><rect x="666" y="452" width="388" height="12" rx="6" fill="#ECE8DE"/><line x1="811.5" y1="444" x2="811.5" y2="472" stroke="#1F2A44" stroke-width="2.5"/><circle cx="772.7" cy="458" r="11" fill="#E8890C"/><text x="666.0" y="486.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#E8890C" text-anchor="start">under the line until a figure was given</text><text x="666.0" y="566.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Decision-maker named</text><text x="1054.0" y="566.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#AE3EC9" text-anchor="end">3.7</text><rect x="666" y="582" width="388" height="12" rx="6" fill="#ECE8DE"/><line x1="811.5" y1="574" x2="811.5" y2="602" stroke="#1F2A44" stroke-width="2.5"/><circle cx="931.78" cy="588" r="11" fill="#AE3EC9"/><text x="666.0" y="636.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280" text-anchor="start">Scale 1 to 5; the dark tick at 2.5 counts as covered</text><line x1="1092" y1="430" x2="1148" y2="430" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="1160" y="300" width="370" height="250" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><circle cx="1200" cy="350" r="16" fill="#2B8A3E"/><path d="M1192.8,350.32 l5.12,5.12 l9.6,-9.92" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1230.0" y="358.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#1F2A44" text-anchor="start">Database</text><rect x="1184" y="406" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E8890C" stroke-width="2.5"/><text x="1230.0" y="430.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#E8890C" text-anchor="start">Budget</text><circle cx="1200" cy="494" r="16" fill="#2B8A3E"/><path d="M1192.8,494.32 l5.12,5.12 l9.6,-9.92" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1230.0" y="502.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#1F2A44" text-anchor="start">Decision-maker</text><text x="1230.0" y="452.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#E8890C" text-anchor="start">ticked later, when a figure was given</text>
