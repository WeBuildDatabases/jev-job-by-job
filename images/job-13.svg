4" text-anchor="start">Before you start</text><rect x="952" y="426" width="556" height="44" rx="6" fill="#FFF4C8" stroke="#E8D58A" stroke-width="1.5"/><text x="966.0" y="454.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2A44" text-anchor="start">Warning: restoring overwrites every change made since the snapshot.</text><rect x="952" y="484" width="556" height="70" rx="6" fill="#FFFFFF" stroke="#E8890C" stroke-width="2" stroke-dasharray="6 4"/><text x="966.0" y="510.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2A44" text-anchor="start">SELECT the snapshot with the latest timestamp…</text><text x="966.0" y="538.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#E8890C" text-anchor="start">A person checks this block, called a warning at 0.35.</text><text x="952.0" y="590.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2A44" text-anchor="start">1.  Stop the application workers.</text><text x="70.0" y="740.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#C92A2A" text-anchor="start">Not every slip has low confidence. In a second runbook “3. Verify” was called a list step at 0.78.</text>
