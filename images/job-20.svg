<rect width="1600" height="900" fill="#F7F5F0"/>
<text x="70.0" y="82.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#1F2A44" text-anchor="start">Job 20</text><text x="157.0" y="82.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">Techniques</text><text x="1530.0" y="82.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="end">4 of 4 examples right in our tests</text>
<text x="70.0" y="152.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="54" font-weight="600" fill="#1F2A44" text-anchor="start">Turn text into numbers for a prediction model</text>
<text x="70.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">The note</text><text x="640.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">Narrow questions</text><text x="1160.0" y="229.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">Your model</text>
<path d="M70,270 q0,-8 8,-8 h446 l26,26 v296 q0,8 -8,8 h-472 q-8,0 -8,-8 z" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><path d="M524,262 v26 h26" fill="#EFEBE2" stroke="#D9D4C7" stroke-width="1.5"/><text x="96.0" y="300.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">Account note</text><text x="96.0" y="340.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">Our internal champion resigned. They asked</text><text x="96.0" y="366.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">about the roadmap. Budget is not a concern</text><text x="96.0" y="392.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">for them this year. Renewal is in Q3. Weekly</text><text x="96.0" y="418.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">active users doubled since spring. No data</text><text x="96.0" y="444.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">issues were raised. Their team is evaluating two</text><text x="96.0" y="470.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1F2A44" text-anchor="start">competitors this quarter.</text><line x1="560" y1="420" x2="628" y2="420" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="640" y="262" width="440" height="268" rx="10" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="666.0" y="306.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Evaluating a competitor?</text><text x="1054.0" y="306.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#4C5A73" text-anchor="end">0.98</text><rect x="666" y="318" width="388" height="14" rx="7.0" fill="#ECE8DE"/><rect x="666" y="318" width="380.24" height="14" rx="7.0" fill="#4C5A73"/><text x="666.0" y="382.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Champion has left?</text><text x="1054.0" y="382.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#4C5A73" text-anchor="end">0.96</text><rect x="666" y="394" width="388" height="14" rx="7.0" fill="#ECE8DE"/><rect x="666" y="394" width="372.47999999999996" height="14" rx="7.0" fill="#4C5A73"/><text x="666.0" y="458.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="start">Cutting spend?</text><text x="1054.0" y="458.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#4C5A73" text-anchor="end">0.03</text><rect x="666" y="470" width="388" height="14" rx="7.0" fill="#ECE8DE"/><rect x="666" y="470" width="14" height="14" rx="7.0" fill="#4C5A73"/><line x1="1092" y1="420" x2="1148" y2="420" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="1160" y="300" width="370" height="56" rx="8" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><text x="1222.0" y="336.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="middle">0.98</text><text x="1345.0" y="336.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="middle">0.96</text><text x="1468.0" y="336.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#1F2A44" text-anchor="middle">0.03</text><line x1="1345" y1="370" x2="1345" y2="420" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="1235" y="430" width="220" height="64" rx="10" fill="#1F2A44"/><text x="1345.0" y="470.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">prediction model</text><line x1="1345" y1="504" x2="1345" y2="540" stroke="#1F2A44" stroke-width="3" marker-end="url(#ah)" opacity="0.75"/><rect x="1215" y="548" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/><text x="1345.0" y="586.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">renewal-risk score</text><text x="1160.0" y="650.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">On 400 synthetic notes the score was 0.80</text><text x="1160.0" y="676.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">with five questions like these and 0.79 with</text><text x="1160.0" y="702.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280" text-anchor="start">plain word counts, where 0.5 is a coin flip.</text>
<text x="70.0" y="845.0" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#1F2A44" text-anchor="start">Narrow questions turn notes into numbers a model can learn from.</text>
